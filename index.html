<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Cortex 84</title><meta name="theme-color" content="#3a52c8"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"></head><body>
<title>Cortex 84</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
/* Layout : fenêtres de menu façon RPG 16 bits posées sur un paysage nocturne en pixel art (canvas basse résolution agrandi) ; commandes en haut sur ordinateur, barre de manette en bas sur mobile ; un seul thème nuit, assumé */
:root{
  --void:#0a0b26; --win-hi:#3a52c8; --win-lo:#141b62; --panel:linear-gradient(180deg,#3a52c8,#141b62); --panel-2:#26338f; --panel-solid:#1c2680; --well:#0b1040;
  --frame:#eef0ff; --frame-2:#8a94e8; --shade:#04051a;
  --line:rgba(205,214,255,.22); --line-2:rgba(220,228,255,.5);
  --ink:#ffffff; --ink-2:#d3d9ff; --ink-3:#a9b2f0;
  --magenta:#ff4d6d; --cyan:#5fd3ff; --violet:#b694ff; --amber:#ffc93c; --sun:#ff8f3a;
  --good:#66e04a; --warn:#ffd23f; --crit:#ff3b3b;
  --i1:#2f8f6a; --i2:#b8a01e; --i3:#e07020; --i4:#d62a3c; --i5:#8e1b8a;
  --glow-c:2px 2px 0 #04051a; --glow-m:3px 3px 0 #04051a;
  --win-shadow:0 0 0 2px #04051a,inset 0 0 0 2px #8a94e8,5px 6px 0 0 rgba(4,5,26,.55);
  --hand:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 11' shape-rendering='crispEdges'><g fill='%2304051a'><rect x='7' y='1' width='9' height='4'/><rect x='1' y='2' width='8' height='9'/><rect x='3' y='0' width='4' height='3'/></g><g fill='%23fff'><rect x='7' y='2' width='8' height='2'/><rect x='2' y='3' width='6' height='7'/><rect x='4' y='1' width='2' height='2'/></g><g fill='%238a94e8'><rect x='4' y='6' width='4' height='1'/><rect x='4' y='8' width='4' height='1'/></g></svg>");
  --f-logo:"Press Start 2P","Courier New",monospace;
  --f-head:"Silkscreen","Courier New",monospace;
  --f-body:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
  --f-data:"VT323","Consolas","Courier New",monospace;
  --r:6px;
  color-scheme:dark;
}
body.calm{
  --void:#06070f; --win-hi:#2b3050; --win-lo:#13162a; --panel:linear-gradient(180deg,#2b3050,#13162a); --panel-2:#1f2440; --panel-solid:#191d36; --well:#0a0c1c;
  --frame:#b9bdd2; --frame-2:#5d6386;
  --ink:#e4e6f0; --ink-2:#b8bdd4; --ink-3:#8f95b2;
  --magenta:#c47585; --cyan:#86aebd; --violet:#9a8cbc; --amber:#cfb06a; --sun:#c58a62; --good:#86b276; --crit:#d06060;
  --i1:#3d6658; --i2:#7d7440; --i3:#8f6040; --i4:#8c3e4a; --i5:#6a3a68;
  --win-shadow:0 0 0 2px #04051a,inset 0 0 0 2px #5d6386;
}
*{box-sizing:border-box}
*,*::before,*::after{font-variant-ligatures:none!important}
[hidden]{display:none!important}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;overflow-x:hidden}
body.calm{font-size:17px}
body.noscroll{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--win-hi)}
#scene{position:fixed;left:0;top:0;width:100%;height:100vh;height:100lvh;z-index:0;display:block;pointer-events:none;image-rendering:pixelated}
.scan{position:fixed;inset:0;pointer-events:none;z-index:60;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.1) 0 1px,transparent 1px 3px)}
body.calm .scan{display:none}
.sr,.pick{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;opacity:0}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
@keyframes blink{50%{opacity:.2}}

/* ---------- en-tête & commandes */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(180deg,var(--win-hi),var(--win-lo));border-bottom:3px solid var(--frame);box-shadow:0 2px 0 var(--shade),0 6px 0 rgba(4,5,26,.4)}
.top-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{font-family:var(--f-logo);font-size:20px;line-height:1.25;letter-spacing:.02em;background:linear-gradient(180deg,#fff6c4 0 34%,#ffc93c 34% 66%,#ff8f3a 66% 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(2px 0 0 #04051a) drop-shadow(-2px 0 0 #04051a) drop-shadow(0 2px 0 #04051a) drop-shadow(0 -2px 0 #04051a) drop-shadow(2px 3px 0 #000)}
.logo84{font-family:var(--f-logo);font-size:11px;line-height:1;color:#fff;background:var(--magenta);padding:5px 6px 4px;border:2px solid #fff;border-radius:3px;box-shadow:2px 2px 0 var(--shade);text-shadow:1px 1px 0 var(--shade)}
.tagline{font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);text-shadow:1px 1px 0 var(--shade)}
body.calm .logo{filter:none;background:none;color:var(--ink-2)}
.tabs{display:flex;gap:2px;margin-left:auto;padding:5px;background:rgba(4,5,26,.35);border:2px solid var(--frame-2);border-radius:5px}
.tab{position:relative;display:flex;align-items:center;gap:7px;padding:8px 11px 8px 26px;border:0;border-radius:3px;background:none;color:var(--ink-2);font-family:var(--f-head);font-weight:700;font-size:12px;line-height:1.2;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;min-height:40px;text-shadow:2px 2px 0 var(--shade)}
.tab .ic{display:none}
.tab:hover{color:#fff;background:rgba(255,255,255,.08)}
.tab[aria-current="page"]{color:var(--amber)}
.tab[aria-current="page"]::before{content:"";position:absolute;left:3px;top:50%;width:19px;height:13px;margin-top:-7px;background:var(--hand) center/contain no-repeat;animation:poke .9s steps(2) infinite}
@keyframes poke{50%{transform:translateX(3px)}}
.tools{display:flex;align-items:center;gap:10px}
.status{display:flex;align-items:center;gap:7px;font-family:var(--f-data);font-size:19px;color:var(--ink-2);white-space:nowrap;text-shadow:1px 1px 0 var(--shade)}
.status i{width:8px;height:8px;background:var(--good);box-shadow:1px 1px 0 var(--shade)}
.status.st-pending i{background:var(--warn);animation:blink 1s steps(2) infinite}
.status.st-local i{background:var(--amber)}
.status.st-err i{background:var(--crit)}
.status.st-demo i{background:var(--violet)}
.hbtn{display:flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:4px;border:2px solid var(--frame-2);background:rgba(4,5,26,.35);color:var(--ink-2);font:600 14px var(--f-body);cursor:pointer}
.hbtn:hover{border-color:var(--amber)}
.hbtn[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
@media (max-width:1400px){.tagline{display:none}}
@media (max-width:760px){
  .top-in{padding-block:9px}
  .logo{font-size:16px}.logo84{font-size:9px}
  .tools{margin-left:auto}
  .hbtn span{display:none}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;margin:0;border:0;border-radius:0;border-top:3px solid var(--frame);box-shadow:0 -2px 0 var(--shade);background:linear-gradient(180deg,var(--win-hi),var(--win-lo));display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;padding:5px max(4px,env(safe-area-inset-right,0px)) calc(5px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
  .tab{flex-direction:column;justify-content:center;gap:4px;padding:5px 1px;font-family:var(--f-body);font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;min-height:52px;text-shadow:1px 1px 0 var(--shade)}
  .tab .ic{display:block;width:20px;height:20px}
  .tab[aria-current="page"]{background:rgba(4,5,26,.5);box-shadow:inset 0 0 0 2px var(--amber)}
  .tab[aria-current="page"]::before{display:none}
}

/* ---------- page */
.app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 150px}
.vhead{padding-block:24px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.vhead h1{margin:0;font-family:var(--f-head);font-weight:700;font-size:clamp(20px,3.6vw,28px);line-height:1.25;letter-spacing:.03em;text-transform:uppercase;text-wrap:balance;color:var(--amber);text-shadow:3px 3px 0 var(--shade)}
.vhead p{margin:8px 0 0;color:var(--ink-2);max-width:64ch;text-shadow:1px 1px 0 var(--shade)}
.card{position:relative;background:var(--panel);border:3px solid var(--frame);border-radius:var(--r);box-shadow:var(--win-shadow);padding:16px 16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ch{display:flex;flex-direction:column;gap:6px}
.ch h2{margin:0;font-family:var(--f-head);font-size:16px;font-weight:700;line-height:1.25;letter-spacing:.03em;text-transform:uppercase;text-wrap:balance;text-shadow:2px 2px 0 var(--shade)}
.hud{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);text-shadow:1px 1px 0 var(--shade)}
.hud .ic{width:15px;height:15px}
.lbl,.tfield>span,.field>span{font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.hint{margin:0;font-size:13.5px;line-height:1.45;color:var(--ink-2)}
.mini{font-size:14px;color:var(--ink-2)} .mini b{font-family:var(--f-data);font-size:22px;color:#fff;font-weight:400}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row input{flex:1;min-width:0}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:end}
@media (max-width:520px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3 .switch{grid-column:1/-1}}
.tfield,.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.app input:not([type=checkbox]):not([type=range]):not([type=file]),.sheet input:not([type=checkbox]):not([type=range]),select,textarea{background:var(--well);border:2px solid var(--frame-2);border-radius:3px;box-shadow:inset 2px 2px 0 rgba(0,0,0,.45);color:#fff;font:500 16px var(--f-body);padding:9px 12px;min-height:44px;width:100%}
.app input:focus,.sheet input:focus,select:focus,textarea:focus{border-color:var(--amber);outline:none}
textarea{resize:vertical;line-height:1.45}
input[type=time]{font-family:var(--f-data)!important;font-size:26px!important;color:var(--cyan)!important;padding:3px 10px!important}
input[type=date]{font-family:var(--f-data)!important;font-size:21px!important;padding:5px 10px!important}
input::placeholder,textarea::placeholder{color:var(--ink-3);opacity:.85}

/* ---------- boutons & commandes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:4px;border:2px solid var(--frame);background:linear-gradient(180deg,#4b63da,#232f8e);color:#fff;font:600 15px/1.2 var(--f-body);letter-spacing:.02em;cursor:pointer;text-align:center;text-shadow:1px 1px 0 var(--shade);box-shadow:0 3px 0 var(--shade)}
.btn:hover{border-color:var(--amber)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shade)}
.btn.prime{background:linear-gradient(180deg,#ff6b80,#c41d3b);border-color:#ffd3da}
.btn.neon{background:linear-gradient(180deg,#ffd95e,#dd960e);border-color:#fff3c4;color:#2b1700;text-shadow:none}
.btn.ghost{background:rgba(4,5,26,.35);border-color:var(--frame-2)}
.btn.ghost:hover{border-color:var(--amber)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.wide{width:100%}
.btn.hot{background:linear-gradient(180deg,#ff5a5a,#ad1222);border-color:#ffc4c4}
.btn.danger{background:rgba(4,5,26,.35);border-color:#ff9a9a;color:#ffc2c2}
.btn.danger.armed{background:var(--crit);border-color:#fff;color:#fff}
.btn.okon{background:linear-gradient(180deg,#72e062,#2e9a2a);border-color:#d9ffd2}
.btn:disabled,.btn.dis{opacity:.4;cursor:default;transform:none}
.btn.dis{pointer-events:none}
body.calm .btn{background:var(--panel-2);border-color:var(--frame-2);color:var(--ink);text-shadow:none}
.arrow{flex:none;width:44px;height:44px;border-radius:4px;border:2px solid var(--frame);background:var(--panel);color:var(--amber);font:700 26px/1 var(--f-body);cursor:pointer;box-shadow:0 3px 0 var(--shade);text-shadow:2px 2px 0 var(--shade)}
.arrow:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shade)}
.arrow:disabled{opacity:.3;cursor:default;transform:none}
.icobtn{width:40px;height:40px;border-radius:4px;border:2px solid var(--frame-2);background:rgba(4,5,26,.35);color:#fff;cursor:pointer;display:grid;place-items:center}
.icobtn:hover{border-color:var(--amber)}
.seg{display:flex;gap:4px;padding:4px;border-radius:4px;background:rgba(4,5,26,.4);border:2px solid var(--frame-2)}
.seg button{flex:1;min-height:40px;border:0;border-radius:3px;background:transparent;color:var(--ink-2);font:500 14px/1.15 var(--f-body);cursor:pointer;padding:6px 8px}
.seg button:hover{color:#fff;background:rgba(255,255,255,.07)}
.seg button.on{background:rgba(255,201,60,.18);color:var(--amber);box-shadow:inset 0 0 0 2px var(--amber);text-shadow:1px 1px 0 var(--shade)}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 1 auto}
.seg.q5 button{display:flex;flex-direction:column;align-items:center;gap:2px}
.seg.q5 b{font-family:var(--f-data);font-size:26px;font-weight:400;line-height:1}
.seg.q5 span{font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:3px;border:2px solid var(--frame-2);background:rgba(4,5,26,.35);color:var(--ink-2);font:500 14px var(--f-body);cursor:pointer}
.chip small{color:var(--ink-3)}
.chip:hover{color:#fff}
.chip.on{border-color:var(--amber);color:#fff;background:rgba(255,201,60,.2);box-shadow:2px 2px 0 var(--shade)}
.chip.on::before{content:"";flex:none;width:6px;height:10px;background:var(--amber);clip-path:polygon(0 0,100% 50%,0 100%)}
.chip-x{border:0;background:none;color:var(--ink-2);cursor:pointer;font:700 14px var(--f-body);padding:0 2px}
.switch{display:flex;align-items:center;gap:12px;cursor:pointer;min-height:44px;position:relative}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.sw{flex:none;width:48px;height:26px;border-radius:3px;background:var(--well);border:2px solid var(--frame-2);position:relative;box-shadow:inset 2px 2px 0 rgba(0,0,0,.45)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:2px;background:var(--ink-3);box-shadow:1px 1px 0 var(--shade)}
.switch input:checked+.sw{background:rgba(102,224,74,.28);border-color:var(--good)}
.switch input:checked+.sw::after{left:25px;background:var(--good)}
.switch input:focus-visible+.sw{outline:3px solid var(--amber);outline-offset:2px}
.switch small{display:block;color:var(--ink-2);font-size:12.5px;line-height:1.35}
.stepper{display:inline-flex;align-items:center;border:2px solid var(--frame-2);border-radius:4px;overflow:hidden;align-self:flex-start;background:rgba(4,5,26,.4)}
.stepper button{width:46px;height:44px;border:0;background:rgba(255,255,255,.08);color:var(--amber);font:700 22px var(--f-body);cursor:pointer;text-shadow:1px 1px 0 var(--shade)}
.stepper button:active{background:rgba(255,201,60,.22)}
.stepper output{min-width:64px;text-align:center;font-family:var(--f-data);font-size:28px;padding-inline:4px}
.stepper.sm output{min-width:96px;font-size:22px}
.stepper.dis{opacity:.4;pointer-events:none}

/* ---------- vue Jour */
.dayhead{display:flex;flex-direction:column;gap:12px;padding-block:20px 14px}
.datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:relative}
.datebtn{display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:none;border:0;color:var(--ink);cursor:pointer;padding:2px 6px;text-align:left;min-width:0}
.datebtn .wd{font-family:var(--f-head);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);text-shadow:2px 2px 0 var(--shade)}
.datebtn .dd{font-family:var(--f-head);font-weight:700;font-size:clamp(18px,4vw,26px);line-height:1.2;text-transform:uppercase;text-shadow:3px 3px 0 var(--shade)}
.ribbon{display:flex;gap:5px;overflow-x:auto;padding:3px 3px 8px;scrollbar-width:none;scroll-snap-type:x proximity}
.ribbon::-webkit-scrollbar{display:none}
.rb{flex:1 0 46px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border-radius:3px;border:2px solid var(--frame-2);background:var(--win-lo);color:var(--ink-2);cursor:pointer;font-family:var(--f-data);box-shadow:0 2px 0 var(--shade)}
.rb.hd{background:var(--c);border-color:#fff;color:#fff}
.rb.sel{outline:3px solid var(--amber);outline-offset:1px}
.rb-w{font-size:14px;text-transform:uppercase;line-height:1}
.rb-n{font-size:21px;line-height:1;color:#fff;text-shadow:1px 1px 0 var(--shade)}
.rb-dot{width:5px;height:5px}
.rb-dot.on{background:var(--amber);box-shadow:1px 1px 0 var(--shade)}
.daygrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
@media (max-width:860px){.daygrid{grid-template-columns:minmax(0,1fr)}}
.welcome ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.welcome p{margin:0;color:var(--ink-2)}
.ongoing{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;margin-bottom:16px;border-radius:var(--r);border:3px solid #ffd0d6;background:linear-gradient(180deg,#c8283c,#760d22);box-shadow:0 0 0 2px var(--shade),4px 5px 0 rgba(4,5,26,.5)}
.ongoing>div{flex:1;min-width:180px;text-shadow:1px 1px 0 var(--shade)}
.pulse{flex:none;width:12px;height:12px;background:#fff;box-shadow:2px 2px 0 var(--shade);animation:blink 1s steps(2) infinite}
.calm-msg{margin:0;color:var(--ink-2)}
.atts,.intakes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.att{display:flex;gap:8px;align-items:center}
.att-main{flex:1;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;align-items:center;text-align:left;padding:10px 12px;border-radius:4px;border:2px solid var(--frame-2);background:rgba(4,5,26,.35);color:var(--ink);cursor:pointer;font:inherit;min-width:0}
.att-main:hover{border-color:var(--amber)}
.att-int{grid-row:span 2;display:flex;align-items:baseline;gap:1px;font-family:var(--f-data);background:var(--c);padding:3px 8px 1px;border:2px solid #fff;border-radius:3px;box-shadow:2px 2px 0 var(--shade)}
.att-int b{font-size:40px;line-height:.9;font-weight:400;color:#fff;text-shadow:2px 2px 0 var(--shade)}
.att-int small{font-size:17px;color:#fff}
.att-txt{display:flex;flex-direction:column;min-width:0}
.att-txt b{font-weight:600}
.att-txt>span{color:var(--ink-2);font-size:14px}

  if(A.FD.skipN>=3&&A.FD.fullN>=3)ins.push(`<div class="insight"><span class="big">${fmtPct(A.FD.pSkip)}</span><p>des jours avec un repas sauté ont eu une crise, contre <b>${fmtPct(A.FD.pFull)}</b> les jours avec trois repas.</p></div>`);

  const c5=barsSVG({W,h:170,cats:Y.months.map(m=>({label:monShort(m.k),tip:`${cap(monthLabel(m.k))}|${m.sp} séance${m.sp>1?'s':''} de sport`})),series:[{color:'var(--cyan)',vals:Y.months.map(m=>m.sp)}],aria:'Séances de sport par mois'});
  const spfd=`<section class="card span2"><header class="ch"><span class="hud">${A.SP.n} séance${A.SP.n>1?'s':''} · ${A.FD.n} jour${A.FD.n>1?'s':''} de repas renseignés</span><h2>Sport, repas et caféine</h2></header>
    <div class="kpis">${kS('Séances par semaine',fmtN(A.SP.perWeek),'',A.SP.durMean!=null?'durée moyenne '+fmtDur(A.SP.durMean/60):'')}${kS('Calories moyennes',A.FD.mean!=null?Math.round(A.FD.mean):'—',A.FD.mean!=null?'kcal':'',A.FD.n+' jours renseignés')}${kS('Les jours de crise',A.FD.att!=null?Math.round(A.FD.att):'—',A.FD.att!=null?'kcal':'',A.FD.other!=null?'contre '+Math.round(A.FD.other)+' kcal les autres jours':'')}${kS('Repas sautés',A.FD.skipN,'j',A.FD.pSkip!=null?fmtPct(A.FD.pSkip)+' avec une crise':'')}${kS('Caféine moyenne',A.CF.mean!=null?Math.round(A.CF.mean):'—',A.CF.mean!=null?'mg':'',A.CF.n?'estimée sur '+A.CF.n+' jours'+(A.CF.nE?' · '+A.CF.nE+' avec boisson énergisante':''):'Note tes cafés dans la carte Contexte')}</div>
    <div class="clegend"><span><i style="background:var(--cyan)"></i>Séances de sport par mois (12 mois)</span></div>${c5}
    <p class="hint">Une crise peut aussi couper l’appétit ou faire sauter une séance : ces rapprochements sont des pistes à discuter avec ton médecin, pas des preuves.</p></section>`;
  return demoStrip()+head+`<div class="kpis">${kp}</div><div class="ana">
    <section class="card span2"><header class="ch"><span class="hud">12 derniers mois</span><h2>Jours de céphalée par mois</h2></header><div class="clegend"><span><i style="background:var(--magenta)"></i>Migraine</span><span><i style="background:var(--cyan)"></i>Autres céphalées</span><span><i class="dash"></i>Seuil de 15 jours</span></div>${c1}</section>
    <section class="card span2"><header class="ch"><span class="hud">12 derniers mois · surveillance de la surconsommation</span><h2>Jours avec traitement de crise</h2></header>${c2}
      <p class="hint">${flagged.length?'Seuil dépassé en '+flagged.map(m=>monthLabel(m.k)).join(', ')+'. Survole une barre pour le détail par classe.':'Aucun mois au-dessus des seuils. Survole une barre pour le détail par classe.'}</p></section>
    <section class="card span2"><header class="ch"><span class="hud">${Math.min(n,90)} dernières nuits</span><h2>Sommeil et crises</h2></header><div class="clegend"><span><i style="background:var(--cyan);height:3px;vertical-align:4px"></i>Durée de la nuit</span><span><i class="dot" style="background:var(--magenta)"></i>Crise ce jour-là</span></div>${c3}</section>
    ${spfd}
    <section class="card"><header class="ch"><span class="hud">Ce que montre ton journal</span><h2>Repères</h2></header>${ins.join('')}</section>
    <section class="card"><header class="ch"><span class="hud">${A.T.att} crises sur la période</span><h2>Heure de début</h2></header>${c4}</section>
    <section class="card"><header class="ch"><span class="hud">Part des crises</span><h2>Déclencheurs rapportés</h2></header>${barList(A.trig,A.T.att)}</section>
    <section class="card"><header class="ch"><span class="hud">Part des crises</span><h2>Symptômes associés</h2></header>${barList(A.sym,A.T.att)}</section>
    <section class="card span2"><header class="ch"><span class="hud">Effet noté 2 h après la prise</span><h2>Efficacité des traitements</h2></header>${medT}</section></div>`;
}

/* ================= vue Santé ================= */
function lineSVG(o){
  const W=o.W,H=o.h||210,pl=46,pr=12,pt=16,pb=26,iw=W-pl-pr,ih=H-pt-pb;
  const all=o.series.flatMap(s=>s.pts);if(!all.length)return '<p class="hint">Aucune mesure sur la période.</p>';
  const d0=o.from||all.reduce((m,p)=>p.d<m?p.d:m,all[0].d),d1=o.to||today(),span=Math.max(1,diffDays(d0,d1));
  const vs=[...all.map(p=>p.v),...(o.refs||[]).map(r=>r.y)];let lo=Math.min(...vs),hi=Math.max(...vs);const ms=o.minSpan||4;
  if(hi-lo<ms){const c=(hi+lo)/2;lo=c-ms/2;hi=c+ms/2;}
  const step=niceStep(hi-lo);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;if(hi===lo)hi=lo+step;
  const X=d=>pl+Math.max(0,diffDays(d0,d))/span*iw,Y=v=>pt+ih-(v-lo)/(hi-lo)*ih;
  let s='';
  for(let v=lo;v<=hi+1e-9;v+=step)s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="rgba(210,218,255,.16)"/><text x="${pl-6}" y="${(Y(v)+5).toFixed(1)}" text-anchor="end" fill="var(--ink-3)" font-family="var(--f-data)" font-size="16">${fmtN(v)}</text>`;
  (o.refs||[]).forEach(r=>{const y=Y(r.y).toFixed(1);s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--ink-2)" stroke-width="1.3" stroke-dasharray="5 4"/><text x="${W-pr}" y="${+y-5}" text-anchor="end" fill="var(--ink-2)" font-family="var(--f-data)" font-size="16">${esc(r.label)}</text>`;});
  for(let k=0;k<=4;k++){const d=addDays(d0,Math.round(span*k/4));s+=`<text x="${X(d).toFixed(1)}" y="${H-7}" text-anchor="${k===0?'start':k===4?'end':'middle'}" fill="var(--ink-3)" font-family="var(--f-data)" font-size="16">${span>200?esc(monShort(d.slice(0,7)))+' '+d.slice(2,4):+d.slice(8)+' '+esc(monShort(d.slice(0,7)))}</text>`;}
  o.series.forEach(se=>{const pts=se.pts.slice().sort((a,b)=>a.d.localeCompare(b.d));
    if(pts.length>1)s+=`<path d="${pts.map((p,i)=>(i?'L':'M')+X(p.d).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ')}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const r=pts.length>60?2:3.5;pts.forEach(p=>s+=`<circle cx="${X(p.d).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${r}" fill="${se.color}"/>`);});
  const tipPts={};o.series.forEach(se=>se.pts.forEach(p=>{(tipPts[p.d]=tipPts[p.d]||[]).push(se.name+' '+fmtN(p.v)+(se.unit?' '+se.unit:''));}));
  Object.keys(tipPts).forEach(d=>{const ys=o.series.flatMap(se=>se.pts.filter(p=>p.d===d).map(p=>Y(p.v)));s+=`<circle cx="${X(d).toFixed(1)}" cy="${(ys.reduce((a,b)=>a+b,0)/ys.length).toFixed(1)}" r="11" fill="transparent" data-tip="${esc(cap(fd('short',d))+'|'+tipPts[d].join('|'))}"/>`;});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.aria||'')}">${s}</svg>`;
}
function vSante(){

    <div class="seg" role="group" aria-label="Période">${[['90','3 mois'],['365','12 mois'],['all','Tout']].map(([k,l])=>`<button class="${rg===k?'on':''}" data-act="h-range" data-v="${k}">${l}</button>`).join('')}</div></div>`;

  const chg=L&&prev&&diffDays(prev.d,L.d)<=120?`${L.v-prev.v>=0?'+':'−'}${fmtN(Math.abs(L.v-prev.v))} kg depuis le ${fd('dm',prev.d)}`:'';

  const cH=lineSVG({W:W2,h:210,from:from||(HR[0]&&HR[0].d),to,series:[{name:'Pouls',unit:'bpm',color:'var(--amber)',pts:HR}],minSpan:10,aria:'Évolution du pouls au repos'});
  const recent=Object.keys(D()).filter(d=>hasHealth(D()[d].health)).sort().reverse().slice(0,8);

  return demoStrip()+head+`<div class="kpis">${kp}</div><div class="ana">
    <section class="card span2"><header class="ch"><span class="hud">${Wt.length} pesée${Wt.length>1?'s':''} sur la période</span><h2>Poids</h2></header>${cW}
      ${Lw?`<p class="hint">Tour de taille : ${fmtN(Lw.v)} cm le ${esc(fd('dm',Lw.d))}${WS.length>1?' · '+(WS[WS.length-1].v-WS[0].v>=0?'+':'−')+fmtN(Math.abs(WS[WS.length-1].v-WS[0].v))+' cm sur la période':''}.</p>`:''}
      <p class="hint">L’IMC est un repère de l’OMS qui ne distingue pas le muscle de la graisse : pour un sportif, il compte moins que la tendance.</p></section>
    <section class="card"><header class="ch"><span class="hud">${BP.length} mesure${BP.length>1?'s':''} · mmHg</span><h2>Tension artérielle</h2></header>
      <div class="clegend"><span><i class="dot" style="background:var(--magenta)"></i>Haute (systolique)</span><span><i class="dot" style="background:var(--cyan)"></i>Basse (diastolique)</span><span><i class="dash"></i>Seuil 140/90</span></div>${cB}
      <p class="hint">Une mesure isolée ne veut pas dire grand-chose : mesure-toi assis, au calme, plusieurs jours de suite. La tension compte pour le choix de certains traitements de la migraine.</p></section>

      (x.meds||[]).map(m=>[m.time,m.name,m.dose,m.eff?'effet '+lbl(EFF,m.eff).toLowerCase():''].filter(Boolean).join(' ')).join(' | '),

function makeDemo(){
  let s=20260;const r=()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};
  const end=today(),start=addDays(end,-364),days={},cyc0=8,prophStart=addDays(start,196);let prevHard=false;
  const cat=[{id:'d-ibu',name:'Ibuprofène',cls:'ains',dose:'400 mg'},{id:'d-para',name:'Paracétamol',cls:'para',dose:'1 g'},{id:'d-suma',name:'Sumatriptan',cls:'triptan',dose:'50 mg'},{id:'d-dom',name:'Dompéridone',cls:'antiemet',dose:'10 mg'}];
  for(let i=0;i<365;i++){
    const d=addDays(start,i),wd=parseD(d).getDay(),we=wd===0||wd===6;if(r()<.04)continue;
    const doc={date:d,attacks:[],meds:[]},short=r()<.17,hrs=short?4.4+r()*1.4:6.3+r()*2.3,wake=(we?500:400)+Math.round(r()*50-25);
    doc.sleep={bed:m2hm(wake-Math.round(hrs*60)),wake:m2hm(wake),q:Math.min(5,short?1+Math.floor(r()*2):3+Math.floor(r()*3))};
    if(i>330){const asl=Math.round(hrs*60*.92);Object.assign(doc.sleep,{dur:asl,deep:Math.round(asl*.18),rem:Math.round(asl*.22),light:asl-Math.round(asl*.18)-Math.round(asl*.22),awake:Math.round(hrs*60*.08),score:Math.round(short?55+r()*12:70+r()*20),hr:Math.round(54+r()*8)});}
    if((we&&r()<.3)||r()<.05)doc.naps=[{id:'n'+i,start:'14:'+pad(Math.floor(r()*50)),dur:[15,20,30,45][Math.floor(r()*4)]}];
    const cd=((i-cyc0)%28+28)%28,peri=cd>=26||cd<=2,stressy=i>=95&&i<=135;doc.menses=cd<5;
    doc.stress=Math.min(4,stressy?2+Math.floor(r()*3):Math.floor(r()*3));doc.coffee=1+Math.floor(r()*3);if(r()<.14)doc.energy=500;
    doc.sport=[];
    if((wd===2||wd===4)&&r()<.88)doc.sport.push({id:'k'+i,type:'karate',name:'',start:'19:00',dur:90,int:Math.min(4,2+Math.floor(r()*2)+(r()<.15?1:0)),kcal:null,note:''});
    else if(we&&r()<.3)doc.sport.push({id:'k'+i,type:'marche',name:'',start:'10:30',dur:60,int:1,kcal:null,note:''});
    let skip=false;
    if(r()<.72){skip=r()<.1;const ml={pdj:skip&&r()<.6?0:Math.round(280+r()*220),dej:skip?0:Math.round(480+r()*320),din:Math.round(520+r()*380),col:r()<.6?Math.round(90+r()*220):0};
      if(skip&&ml.pdj>0)ml.dej=0;const k=ml.pdj+ml.dej+ml.din+ml.col;doc.food={kcal:k,meals:ml,prot:Math.round(k*.045),gluc:Math.round(k*.12),lip:Math.round(k*.036),water:Math.round((1+r()*1.2)*10)/10};}
    if(r()<.42)(doc.health=doc.health||{}).weight=Math.round((81.8-i*.007+Math.sin(i/9)*.5+(r()-.5)*.8)*10)/10;
    if(r()<.14){const h=doc.health=doc.health||{};h.sys=Math.round(116+r()*20);h.dia=Math.round(72+r()*13);h.hr=Math.round(d>=prophStart?55+r()*7:63+r()*9);}
    if(i%30===3)(doc.health=doc.health||{}).waist=Math.round((88-i*.008)*2)/2;
    let p=.11+(short?.26:0)+(peri?.22:0)+(stressy?.36:0)+(skip?.2:0)+(prevHard?.1:0)+(doc.energy?.09:0);if(d>=prophStart)p*=.55;
    prevHard=doc.sport.some(s=>s.int>=4);
    if(r()<p){
      const iv=Math.min(10,3+Math.floor(r()*6)+(peri?1:0)),st=r()<.45?360+Math.floor(r()*240):780+Math.floor(r()*360),mig=r()<.82;
      const a={id:'x'+i,start:m2hm(st),dur:Math.round((mig?4+r()*20:2+r()*5)*2)/2,ongoing:false,int:iv,type:mig?'migraine':'tension',aura:mig&&r()<.16,loc:[],sym:[],trig:[],dis:iv>=8?3:iv>=6?2:iv>=4?1:0,note:''};
      a.loc.push(r()<.5?'gauche':r()<.6?'droite':'bilat');if(r()<.4)a.loc.push(r()<.5?'tempe':'oeil');
      if(mig){if(r()<.7)a.sym.push('photo');if(r()<.6)a.sym.push('phono');if(r()<.5)a.sym.push('nausees');if(r()<.15)a.sym.push('vomis');if(r()<.55)a.sym.push('effort');if(r()<.5)a.sym.push('pulsatile');}else{if(r()<.3)a.sym.push('fatigue');if(r()<.25)a.sym.push('raideur');}
      if(short)a.trig.push('sommeil');if(peri)a.trig.push('regles');if(doc.stress>=3||r()<.2)a.trig.push('stress');if(r()<.18)a.trig.push('ecran');if(skip||r()<.05)a.trig.push('repas');if(r()<.14)a.trig.push('meteo');if(we&&r()<.25)a.trig.push('tropsommeil');
      doc.attacks.push(a);
      const t0=st+20+Math.floor(r()*40),pk=iv>=6||(stressy&&r()<.85)?cat[2]:r()<.6?cat[0]:cat[1];

      if(a.sym.includes('nausees')&&r()<.5)doc.meds.push({id:'z'+i,medId:'d-dom',name:'Dompéridone',cls:'antiemet',dose:'10 mg',time:m2hm(t0),eff:'',attackId:a.id});

    }else if(r()<.4)doc.ok=true;
    days[d]=doc;
  }
  return{days,settings:Object.assign(defaultSettings(),{profile:{name:'Exemple fictif',birth:'1988',neuro:'Dr Exemple',height:'178'},health:{blood:'A+',gp:'Dr Martin (fictif)',allergies:'Aucune connue',history:''},meds:cat,prophylaxis:[{id:'p1',name:'Propranolol',dose:'40 mg matin et soir',start:prophStart,end:''}],questions:'Le propranolol peut-il être augmenté ?\nQue faire quand le sumatriptan ne suffit pas ?'}),

/* Claude lit l'image : dans claude.ai avec le compte du visiteur, ailleurs avec la clé API personnelle gardée dans ce navigateur */
const KEY_KEY='cortex84.apikey';
const apiKey=()=>{try{return localStorage.getItem(KEY_KEY)||'';}catch(e){return '';}};
const inClaude=()=>!!(window.claude&&typeof window.claude.use==='function');
function toB64(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{try{const sc=Math.min(1,1568/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.85).split(',')[1]);}catch(e){URL.revokeObjectURL(u);rej(e);}};im.onerror=()=>{URL.revokeObjectURL(u);rej({code:'image_rejected'});};im.src=u;});}
async function askVision(prompt,files){
  let sample=null;try{sample=inClaude()?await window.claude.use('sample'):null;}catch(e){}
  if(sample){const lim=await sample.limits().catch(()=>null);if(lim&&lim.images)return sample.json(prompt,{images:files.slice(0,lim.images.maxCount||1)});}
  const key=apiKey().trim();if(!key)throw{code:'no_reader'};
  const imgs=await Promise.all(files.slice(0,4).map(toB64));
  let r;try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:900,messages:[{role:'user',content:[...imgs.map(d=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:d}})),{type:'text',text:prompt+'\nRéponds uniquement avec le JSON, sans aucun texte autour.'}]}]})});}
  catch(e){throw{code:'offline'};}
  if(!r.ok)throw{code:r.status===401||r.status===403?'bad_key':r.status===429?'rate_limited':'upstream_error'};
  const j=await r.json(),t=(j.content||[]).map(c=>c.text||'').join(''),m=t.match(/\{[\s\S]*\}/);if(!m)throw{code:'invalid_json'};
  try{return JSON.parse(m[0]);}catch(e){throw{code:'invalid_json'};}
}
const numIn=v=>{const x=typeof v==='string'?parseFloat(v.replace(',','.')):v;return isNum(x)&&x>=0?Math.round(x*10)/10:null;};
const hmIn=v=>{if(typeof v!=='string')return null;const m=v.trim().match(/^(\d{1,2})[:h](\d\d)$/);return m&&+m[1]<24&&+m[2]<60?pad(+m[1])+':'+m[2]:null;};
function applyFood(date,r){
  let got=0;const fc=foodCfg(),on={kcal:fc.total,burned:fc.burned,prot:fc.macros,gluc:fc.macros,lip:fc.macros,water:fc.water};
  mutate(date,doc=>{const f=doc.food=doc.food||{};f.meals=f.meals||{};
    Object.keys(on).forEach(k=>{const v=numIn(r&&r[k]);if(on[k]&&v!=null){f[k]=v;got++;}});
    if(fc.meals)MEALS.forEach(([k])=>{const v=numIn(r&&r.meals&&r.meals[k]);if(v!=null){f.meals[k]=v;got++;}});
    if(got)f.src='yazio';
    const w=numIn(r&&r.weight);if(w!=null&&w>=25&&w<=350){doc.health=doc.health||{};if(!isNum(doc.health.weight)){doc.health.weight=w;got++;}}});
  return got;
}
function applySleep(date,r){
  let got=0;
  mutate(date,doc=>{const sl=doc.sleep=doc.sleep||{},b=hmIn(r&&r.bed),w=hmIn(r&&r.wake);if(b){sl.bed=b;got++;}if(w){sl.wake=w;got++;}
    [['asleep_min','dur'],['deep_min','deep'],['light_min','light'],['rem_min','rem'],['awake_min','awake'],['score','score'],['hr','hr']].forEach(([a,k])=>{const v=numIn(r&&r[a]);if(v!=null&&v>0&&v<=1440){sl[k]=Math.round(v);got++;}});
    doc.naps=doc.naps||[];(Array.isArray(r&&r.naps)?r.naps:[]).forEach(x=>{const s=hmIn(x&&x.start),m=numIn(x&&x.dur_min);if(m!=null&&m>0&&m<=300&&!doc.naps.some(y=>y.start&&y.start===s)){doc.naps.push({id:uid(),start:s||'',dur:Math.round(m),src:'capture'});got++;}});});
  return got;
}
function visionErr(e,noThumb){const c=e&&e.code;

  return c==='bad_key'?'Clé API refusée : vérifie-la dans Réglages.':c==='offline'?'Pas de connexion : la capture est gardée, saisis les valeurs ou réessaie plus tard.':c==='not_granted'||c==='sampling_disabled'?'Lecture automatique non autorisée : saisis les valeurs à la main.':c==='rate_limited'?'Trop de lectures d’un coup. Réessaie dans un moment.':c==='image_rejected'?'Cette image n’a pas pu être lue. Essaie une autre capture.':c==='invalid_json'||c==='empty_completion'||c==='refused'?'Je n’ai pas réussi à lire cette capture.':'Lecture impossible pour l’instant. Réessaie plus tard.';}

async function saveFile(name,data){
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){}
  if(!dl&&window.top===window){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:name.endsWith('.json')?'application/json':name.endsWith('.csv')?'text/csv':'text/html'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000);toast('Fichier enregistré : '+name);return;}catch(e){}}
  if(!dl){S.sheet={kind:'file',name,data};renderSheet();return;}
  try{const r=await dl.save({filename:name,data});toast(r&&r.status==='delivered'?'Fichier transmis.':'Fichier enregistré : '+name);}
  catch(e){const c=e&&e.code;if(c==='declined')toast('Téléchargement annulé.');else if(c==='rate_limited')toast('Une fenêtre de téléchargement est déjà ouverte.');else{S.sheet={kind:'file',name,data};renderSheet();}}

  fr.readAsText(file);
}

  const o=S.imp;S.imp=null;const dates=Object.keys(o.days).filter(k=>/^\d{4}-\d\d-\d\d$/.test(k)).sort();

  if(o.settings){S.settings=Object.assign(defaultSettings(),clone(o.settings));setPending=true;await flushSettings();}
  if(o.scores&&Array.isArray(o.scores.midas)){const ex=new Set(S.scores.midas.map(m=>m.date+'|'+m.total));o.scores.midas.forEach(m=>{if(!ex.has(m.date+'|'+m.total))S.scores.midas.push(m);});await saveScores();}

/* ================= décor : paysage nocturne en pixel art ================= */
const Scene=(()=>{
  const cv=$('#scene'),ctx=cv.getContext('2d');let W=0,H=0,P=4,raf=null,last=0,fr=0,hz=0,cx=0,stars=[],far=[],mid=[],clouds=[],wins=[];
  const SKY=['#0a0b26','#0d0f31','#11143c','#161a49','#1d2157','#262866','#322f74','#3e3480','#4f3a88','#62408e','#764592'];
  const SKY_CALM=['#06070f','#080a14','#0a0c19','#0d0f1e','#101223','#131528','#16182d','#1a1b31','#1e1e35','#222139','#26243d'];
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const px=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);};
  function build(){
    seed=7;hz=Math.round(H*.6);
    stars=Array.from({length:Math.round(W*hz/110)},()=>({x:Math.floor(rnd()*W),y:Math.floor(rnd()*hz*.82),big:rnd()<.12,p:Math.floor(rnd()*16)}));
    const a=rnd()*6,b=rnd()*6,c=rnd()*6,d=rnd()*6;far=[];mid=[];
    for(let x=0;x<W;x++){
      far.push(Math.round(hz-H*(.09+.045*Math.sin(x*.045+a)+.03*Math.sin(x*.11+b)+.012*Math.sin(x*.37+c))));
      mid.push(Math.round(H*(.75+.035*Math.sin(x*.028+d)+.015*Math.sin(x*.083+a))));
    }
    clouds=Array.from({length:Math.max(3,Math.round(W/90))},()=>({x:rnd()*W,y:Math.round(hz*(.12+rnd()*.5)),w:Math.round(18+rnd()*30),s:.15+rnd()*.25}));
    cx=Math.min(W-20,Math.round(W*.74));
    wins=[[-7,-11],[-2,-11],[3,-11],[-12,-19],[10,-19],[-1,-25]].map(([dx,dy])=>({dx,dy,on:rnd()<.8}));
  }
  function draw(){
    const calm=document.body.classList.contains('calm'),sky=calm?SKY_CALM:SKY,n=sky.length,bh=hz/n;
    for(let i=0;i<n;i++){const y0=Math.floor(i*bh),y1=Math.floor((i+1)*bh);px(0,y0,W,y1-y0+1,sky[i]);
      if(i<n-1){ctx.fillStyle=sky[i+1];for(let x=y1%2;x<W;x+=2)ctx.fillRect(x,y1-1,1,1);}}
    stars.forEach(s=>{if(!calm&&(fr+s.p)%16<2)return;ctx.fillStyle=calm?'#34374d':(s.big?'#fff6c4':'#c9cfff');ctx.fillRect(s.x,s.y,1,1);if(s.big){ctx.fillRect(s.x-1,s.y,3,1);ctx.fillRect(s.x,s.y-1,1,3);}});
    const mr=Math.max(5,Math.round(Math.min(W,H)*.045)),mx=Math.round(W*.84),my=Math.round(hz*.3);
    ctx.fillStyle=calm?'#55576a':'#fff3c2';for(let dy=-mr;dy<=mr;dy++){const hw=Math.round(Math.sqrt(mr*mr-dy*dy));ctx.fillRect(mx-hw,my+dy,hw*2+1,1);}
    ctx.fillStyle=calm?'#47495b':'#e6d38c';ctx.fillRect(mx-Math.round(mr*.45),my-Math.round(mr*.35),Math.max(2,Math.round(mr*.35)),Math.max(2,Math.round(mr*.3)));ctx.fillRect(mx+Math.round(mr*.15),my+Math.round(mr*.2),Math.max(2,Math.round(mr*.45)),Math.max(1,Math.round(mr*.25)));
    clouds.forEach(c=>{const x=Math.round(((c.x+fr*c.s)%(W+c.w*2))-c.w);px(x+6,c.y-2,Math.round(c.w*.4),2,calm?'#1d1f32':'#6f6cb8');px(x+3,c.y,c.w-6,2,calm?'#1a1c2e':'#5c5aa8');px(x,c.y+2,c.w,3,calm?'#15172a':'#3e3d86');});
    for(let x=0;x<W;x++){const y=far[x];px(x,y,1,hz-y+1,calm?'#0e1022':'#15123a');px(x,y,1,1,calm?'#1c1e33':'#4a4398');if(y<hz-H*.15)px(x,y,1,2,calm?'#26283c':'#b4b0ec');}
    px(0,hz,W,H-hz,calm?'#0a0c1a':'#151b52');
    ctx.fillStyle=calm?'#2a2c3a':'#fff3c2';for(let k=0;k<6;k++){const w=Math.max(2,Math.round(mr*(1.5-k*.2)+(calm?0:Math.sin(fr/3+k)*2)));ctx.fillRect(mx-Math.round(w/2),hz+2+k*3,w,1);}
    if(!calm){ctx.fillStyle='#2a3480';for(let k=0;k<10;k++){const x=Math.round(((k*53+fr*(k%2?.5:-.5))%W+W)%W);ctx.fillRect(x,hz+4+k*4,12+k*2,1);}}
    for(let x=0;x<W;x++){const y=mid[x];px(x,y,1,H-y,calm?'#07090f':'#0d2338');px(x,y,1,1,calm?'#14172a':'#2f6a6a');}
    const by=mid[cx],cc=calm?'#04050b':'#081322';
    px(cx-10,by-14,20,15,cc);px(cx-14,by-22,6,23,cc);px(cx+8,by-22,6,23,cc);px(cx-3,by-30,6,17,cc);
    for(let i=0;i<3;i++){px(cx-14+i*2,by-24,1,2,cc);px(cx+8+i*2,by-24,1,2,cc);px(cx-3+i*2,by-32,1,2,cc);}
    for(let i=0;i<5;i++)px(cx-10+i*4,by-16,2,2,cc);
    px(cx-1,by-38,1,6,cc);px(cx,by-38,3,2,calm?'#4a2a34':'#ff4d6d');
    wins.forEach(w=>{const on=calm?w.on:(w.on!==((fr+w.dx*7+80)%40<2));if(on)px(cx+w.dx,by+w.dy,1,2,calm?'#6a5a30':'#ffc93c');});
    px(cx-2,by-5,4,5,'#000');
    px(0,H-Math.round(H*.05),W,Math.round(H*.05)+1,calm?'#030409':'#060e1a');
  }
  function loop(now){raf=requestAnimationFrame(loop);if(now-last<125)return;last=now;fr++;draw();}
  function start(){if(raf)cancelAnimationFrame(raf);raf=null;if(!W)return;const still=document.hidden||document.body.classList.contains('calm')||matchMedia('(prefers-reduced-motion: reduce)').matches;draw();if(!still)raf=requestAnimationFrame(loop);}
  function resize(force){const nw=innerWidth,nh=Math.max(innerHeight,cv.clientHeight||0),np=nw<760?3:4;if(!force&&np===P&&Math.abs(nw-W*P)<P&&Math.abs(nh-H*P)<160)return;P=np;W=Math.ceil(nw/P);H=Math.ceil(nh/P);cv.width=W;cv.height=H;build();draw();}
  addEventListener('resize',()=>{resize(false);start();});
  return{init(){resize(true);start();},start};
})();
let rzT,lastVW=innerWidth;
addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(innerWidth!==lastVW){lastVW=innerWidth;if((S.view==='ana'||S.view==='sante')&&!S.sheet&&!editing())render();}},220);});

/* ================= connexion au stockage ================= */
function onDaysSnap(snap){
  let ch=false;
  snap.docChanges().forEach(c=>{const id=c.doc.id;if(pending.has(id)||saving.has(id))return;
    if(c.type==='removed'){if(S.days[id]){delete S.days[id];ch=true;}return;}
    const v=c.doc.data();if(!v)return;const nv=clone(v);if(JSON.stringify(S.days[id])!==JSON.stringify(nv)){S.days[id]=nv;ch=true;}});
  if(!S.loaded){S.loaded=true;ch=true;}
  if(ch){S.cv=null;if(!S.demo)softRender();}
}
const subs={
  days(){S.refs.days.orderBy('date','desc').limit(1000).onSnapshot(onDaysSnap,e=>snapErr(e,'days'));},
  settings(){S.refs.settings.onSnapshot(s=>{if(setPending||setSaving||!s.exists)return;const nv=Object.assign(defaultSettings(),clone(s.data()));if(JSON.stringify(nv)!==JSON.stringify(S.settings)){S.settings=nv;if(!S.demo)softRender();}},e=>snapErr(e,'settings'));},
  scores(){S.refs.scores.onSnapshot(s=>{if(!s.exists)return;const nv=Object.assign({midas:[]},clone(s.data()));if(JSON.stringify(nv)!==JSON.stringify(S.scores)){S.scores=nv;if(!S.demo&&S.view==='bilan')softRender();}},e=>snapErr(e,'scores'));}
};
function snapErr(e,k){console.warn('Cortex 84 · lecture',k,e);if(e&&e.code==='unavailable')setTimeout(()=>subs[k](),3000);else if(e&&e.code!=='revoked'){S.err=true;status();}}
function goLocal(){const keep={};pending.forEach(d=>{if(S.days[d])keep[d]=S.days[d];});loadLocal();Object.assign(S.days,keep);S.mode='local';S.cv=null;render();flushAll();}
async function connect(){
  const C=window.claude;if(!C||typeof C.use!=='function'){goLocal();return;}
  let db=null,user=null;try{[db,user]=await Promise.all([C.use('db'),C.use('user')]);}catch(e){}
  if(!db||!user){goLocal();return;}
  let id=null;try{id=await user.id();}catch(e){}
  if(!id){goLocal();return;}
  try{const base='data/users/'+id;S.refs={days:db.doc(base+'/journal').collection('days'),settings:db.doc(base+'/settings'),scores:db.doc(base+'/scores'),shots:db.doc(base+'/media').collection('shots')};}catch(e){goLocal();return;}
  S.mode='cloud';subs.days();subs.settings();subs.scores();status();flushAll();softRender();
}

/* ================= démarrage ================= */
function init(){
  const st=document.createElement('style');st.textContent=REP_CSS;document.head.appendChild(st);
  $('#tabs').innerHTML=TABS.map(([v,l,ic])=>`<button class="tab" data-act="tab" data-v="${v}">${icon(ic)}<span>${l}</span></button>`).join('');
  setCalm(document.body.classList.contains('calm'));
  render();Scene.init();connect();
  if('serviceWorker' in navigator&&location.protocol==='https:'&&window.top===window&&!inClaude()&&document.querySelector('link[rel="manifest"]'))navigator.serviceWorker.register('sw.js').catch(()=>{});
  setInterval(()=>{if(findOngoing()&&S.view==='jour'&&!S.sheet&&!editing())render();},60000);
}
loadPrefs();
try{window.claude?.hot?.snapshot?.(()=>({view:S.view,date:S.date,calMonth:S.calMonth}));}catch(e){}
const boot=data=>{if(data&&data.view){S.view=data.view;if(data.date)S.date=data.date;if(data.calMonth)S.calMonth=data.calMonth;}init();};
if(window.claude?.hot?.ready)window.claude.hot.ready(boot);else boot(window.claude?.hot?.data??{});
</script>
